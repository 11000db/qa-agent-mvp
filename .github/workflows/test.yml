name: QA Agent MVP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-api:
    name: 단위 + 웹 API 테스트 (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest 실행 (코어 로직 + 웹 API)
        run: >
          python -m pytest tests/test_core.py tests/test_server.py -v
          --junitxml=test-results/pytest-junit.xml
          --html=test-results/pytest-report.html --self-contained-html

      - name: 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: test-results/

  e2e:
    name: 웹 UI E2E 테스트 (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Node 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 실행 (데스크톱 + 모바일)
        run: npx playwright test --project=ui-desktop --project=ui-mobile

      - name: Playwright 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  external-api:
    name: 외부 API 테스트 (dummyjson)
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Python 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest API 테스트 실행
        run: python -m pytest tests/test_api_login.py -v --html=sample_reports/api_test_report.html

      - name: 리포트 아티팩트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: sample_reports/api_test_report.html
