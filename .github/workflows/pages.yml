name: 측정 결과 페이지 배포

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'measure/results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 페이지 빌드 (measure/results/results.json → site/dist)
        run: python site/build.py

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
